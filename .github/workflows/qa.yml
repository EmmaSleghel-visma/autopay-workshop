name: QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-qa.txt

      - name: Generate CSV test data
        run: python qa/cases.py

      - name: Generate pain.001 test data
        run: python qa/pain001_cases.py

      - name: Run tests (not slow)
        run: >-
          python -m pytest -m "not slow"
          --junitxml=reports/junit.xml
          --cov=fraud_detection --cov-branch
          --cov-report=xml:reports/coverage.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          if-no-files-found: warn

  slow:
    name: slow tests (ubuntu, Python 3.13)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-qa.txt

      - name: Generate CSV test data
        run: python qa/cases.py

      - name: Generate pain.001 test data
        run: python qa/pain001_cases.py

      - name: Run slow tests
        run: python -m pytest -m slow --junitxml=reports/junit-slow.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-slow
          path: reports/
          if-no-files-found: warn

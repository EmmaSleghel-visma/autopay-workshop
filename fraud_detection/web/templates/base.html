<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fraud Detection{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #1d1d1f; background: #f6f7f9; }
    header { background: #1b3a5c; color: #fff; padding: 12px 24px; display: flex; gap: 24px; align-items: center; }
    header a { color: #fff; text-decoration: none; }
    header strong { margin-right: auto; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #dde1e6; border-radius: 6px; padding: 20px; margin-bottom: 16px; }
    .error { color: #b00020; }
    .counts { display: flex; gap: 32px; list-style: none; padding: 0; font-size: 1.1em; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 0.92em; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e3e6ea; }
    th { background: #eef1f4; }
    td:not(:last-child) { white-space: nowrap; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.flagged { background: #fff3f0; }
    .rule { background: #ffd9cf; color: #7a1f00; border-radius: 3px; padding: 1px 6px; margin: 2px 0; font-size: 0.85em; }
    .rule .code { color: #a35a45; font-size: 0.85em; margin-left: 4px; }
    .pager { display: flex; gap: 16px; align-items: center; color: #555; }
    button { padding: 6px 16px; }
  </style>
</head>
<body>
  <header>
    <strong>Fraud Detection</strong>
    <a href="{{ url_for('upload_form') }}">Upload</a>
    <a href="{{ url_for('transactions') }}">Transactions</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
